[Model_Setup]
epochs = 100
lr = 0.001 # 学习率
weight_decay = 5e-4 # 权重衰减 / L2 正则系数
k = 14 # 邻居数量
radius = 560 # 空间邻接半径
nhid1 = 256 # 隐藏层维度
nhid2 = 128
llm_modulation_ratio = 1.2
dropout = 0
alpha = 1
gamma = 0.1
beta = 0.1
no_cuda = False
no_seed = False
seed = 100

[Data_Setting]
fdim = 3000 # 输入特征维度，经过HVG筛选后的基因数